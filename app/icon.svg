<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f0722" />
      <stop offset="100%" stop-color="#05010b" />
    </radialGradient>

    <!-- Deep Ambient Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Frost Blur -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Top Left & Bottom Right Purple Neon Gradients -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.9" />
    </linearGradient>

    <!-- Top Right & Bottom Left Magenta/Pink Neon Gradients -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#db2777" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#c026d3" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glass Specular Highlight Gradient -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Ambient Glow Behind Elements -->
  <g filter="url(#glow)" opacity="0.85">
    <!-- Top-Left Pill Glow -->
    <rect x="145" y="145" width="70" height="150" rx="35" transform="rotate(-45 180 220)" fill="#a855f7" />
    <!-- Top-Right Pill Glow -->
    <rect x="297" y="145" width="70" height="150" rx="35" transform="rotate(45 332 220)" fill="#9333ea" />
    <!-- Bottom-Left Pill Glow -->
    <rect x="145" y="217" width="70" height="150" rx="35" transform="rotate(45 180 292)" fill="#e879f9" />
    <!-- Bottom-Right Pill Glow -->
    <rect x="297" y="217" width="70" height="150" rx="35" transform="rotate(-45 332 292)" fill="#ec4899" />
  </g>

  <!-- Main Frosted Glass Cross Body -->
  <g filter="url(#softGlow)">
    <!-- Top-Left Pill -->
    <g transform="rotate(-45 180 220)">
      <rect x="145" y="145" width="70" height="150" rx="35" fill="url(#purpleGrad)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5" />
      <rect x="149" y="149" width="62" height="65" rx="31" fill="url(#glassReflection)" />
    </g>

    <!-- Top-Right Pill -->
    <g transform="rotate(45 332 220)">
      <rect x="297" y="145" width="70" height="150" rx="35" fill="url(#purpleGrad)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5" />
      <rect x="301" y="149" width="62" height="65" rx="31" fill="url(#glassReflection)" />
    </g>

    <!-- Bottom-Left Pill -->
    <g transform="rotate(45 180 292)">
      <rect x="145" y="217" width="70" height="150" rx="35" fill="url(#pinkGrad)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5" />
      <rect x="149" y="221" width="62" height="65" rx="31" fill="url(#glassReflection)" />
    </g>

    <!-- Bottom-Right Pill -->
    <g transform="rotate(-45 332 292)">
      <rect x="297" y="217" width="70" height="150" rx="35" fill="url(#pinkGrad)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5" />
      <rect x="301" y="221" width="62" height="65" rx="31" fill="url(#glassReflection)" />
    </g>
  </g>
</svg>
